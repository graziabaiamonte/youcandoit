name: youcandoit

services:
  db:
    image: pgvector/pgvector:0.8.7-pg17
    environment:
      POSTGRES_USER: ycdi
      POSTGRES_PASSWORD: ycdi
      POSTGRES_DB: ycdi
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ycdi"]
      interval: 3s
      retries: 20

  ollama:
    image: ollama/ollama:0.40.6
    volumes:
      - ollama:/root/.ollama

    # decommenta se vuoi eseguire ollama online e non in locale
    # ports: ["11434:11434"]

  # one-shot: downloads the chat + embedding models into the ollama volume
  ollama-pull:
    image: ollama/ollama:0.40.6
    depends_on: [ollama]
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint:
      [
        "sh",
        "-c",
        "sleep 3 && ollama pull ${OLLAMA_CHAT_MODEL:-llama3.2:3b} && ollama pull ${OLLAMA_EMBED_MODEL:-nomic-embed-text}",
      ]
    restart: "no"

  api:
    build: ./apps/api
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://ycdi:ycdi@db:5432/ycdi
      TEST_DATABASE_URL: postgresql+asyncpg://ycdi:ycdi@db:5432/ycdi_test
      CONTENT_DIR: /content
      ROADMAP_PATH: /roadmap/ROADMAP.md
      REAL_ROADMAP: /roadmap/ROADMAP.md
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
    volumes:
      - ./content:/content:ro
      - ./ROADMAP.md:/roadmap/ROADMAP.md:ro
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./apps/web
    environment:
      API_URL: http://api:8000
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  pgdata:
  ollama:
